name: Backend Python
on:
  push:
    paths: ['backend/**', 'infra/fiware/**', '.dockerignore', 'render.yaml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'infra/fiware/**', '.dockerignore', 'render.yaml', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vigia
          POSTGRES_PASSWORD: test_ci
          POSTGRES_DB: vigia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vigia -d vigia_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://vigia:test_ci@localhost:5432/vigia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy vigia scripts tests
      - run: python -m pytest
  fiware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar API, Orion e Mongo com limite de 512 MiB e 0.1 CPU
        run: docker compose -f backend/compose.yaml --profile fiware-demo up -d --build fiware-demo
      - name: Verificar estados e reconstrucao do contexto
        run: docker compose -f backend/compose.yaml exec -T fiware-demo python -m scripts.check_fiware --send-demo --exercise-recovery
      - name: Mostrar consumo e encerrar ambiente de teste
        if: always()
        run: |
          docker stats --no-stream
          docker compose -f backend/compose.yaml logs --tail 25 fiware-demo
          docker compose -f backend/compose.yaml --profile fiware-demo down
